name: Before Merge

on:
  pull_request:
    branches: ['main']

jobs:
  verification:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # To compare this branch with the main branch and determine affected projects

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: echo "GOOGLE_SCRIPT_PROJECT_ID=${{ secrets.GOOGLE_SCRIPT_PROJECT_ID }}" > .env

      - name: Create a file for Clasp credentials
        id: write-clasprc
        run: echo "$CLASPRC_JSON_SECRET" >> ~/.clasprc.json
        env:
          CLASPRC_JSON_SECRET: ${{ secrets.CLASPRC_JSON }}

      - name: Clone Google Apps Script project
        run: npx nx run google-apps-script:clasp --configuration=clone

      - name: Build
        run: npx nx affected --target=build --base=origin/main --head=HEAD

      - name: Lint
        run: npx nx affected --target=lint --base=origin/main --head=HEAD

      - name: Test
        run: npx nx affected --target=test --base=origin/main --head=HEAD
